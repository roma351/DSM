
server {
    server_name dsm.example.com;


    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dsm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsm.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        set $upstream http://dsm-backend:3239;
        proxy_pass $upstream;
    }

}


server {
    listen 80;
    server_name dsm.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
