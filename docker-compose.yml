
services:
  dsm-backend:
    build: .
    env_file: .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHONPATH: /app
    restart: on-failure
#   command: >
#      sh -c "python -m app.main"
    networks:
      - shared

  
